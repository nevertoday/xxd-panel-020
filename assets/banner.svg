<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 020</title>
  <desc>Impasto miniature scenes: source-bound subjects emerge from tactile palette-knife paint islands, generous paper space, and restrained editorial typography.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="31" height="27" patternUnits="userSpaceOnUse">
      <path d="M3 9L12 8M20 22L29 20M7 26L12 25" stroke="#262725" stroke-opacity=".035" stroke-width=".7"/>
      <circle cx="23" cy="7" r=".5" fill="#262725" fill-opacity=".045"/>
    </pattern>
    <filter id="roughPaint" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.08" numOctaves="2" seed="20" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#262725" flood-opacity=".18"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F3F0E8"/>
    <rect width="1200" height="400" fill="url(#paper)"/>

    <g transform="translate(676 55)">
      <g filter="url(#roughPaint)">
        <path d="M52 221C95 190 122 132 181 92C237 54 331 65 418 109C376 126 348 147 331 179C304 228 202 245 52 221Z" fill="#A53C34"/>
        <path d="M73 215C145 198 205 185 387 109" stroke="#D7684D" stroke-width="28" stroke-linecap="round" stroke-opacity=".9"/>
        <path d="M91 226C171 208 238 193 402 132" stroke="#6D2927" stroke-width="8" stroke-linecap="round" stroke-opacity=".78"/>
      </g>
      <g transform="translate(172 113)" fill="#262725">
        <rect x="16" y="45" width="143" height="7" rx="2"/>
        <rect x="34" y="52" width="5" height="45"/>
        <rect x="138" y="52" width="5" height="45"/>
        <circle cx="51" cy="29" r="11"/><path d="M41 42C44 32 59 32 62 42L67 73H36Z"/>
        <circle cx="124" cy="29" r="11"/><path d="M113 42C117 32 131 32 135 42L140 73H108Z"/>
        <circle cx="88" cy="20" r="8" fill="#D7B36A"/>
        <path d="M78 40H99L94 52H82Z" fill="#D7B36A"/>
      </g>
      <path d="M55 249H430" stroke="#262725" stroke-width="1.2" stroke-opacity=".38"/>
      <text x="56" y="269" fill="#262725" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2.4">IMPASTO / MINIATURE / PAPER / 020</text>
      <text x="412" y="94" text-anchor="end" fill="#262725" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="1.4">WEIGHT OF MEMORY</text>
      <text x="356" y="230" fill="#262725" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="2">PAINT STUDY</text>
      <text x="356" y="244" fill="#262725" fill-opacity=".62" font-family="Arial, sans-serif" font-size="7" letter-spacing="1.4">KNIFE / RELIEF</text>
    </g>

    <text x="1160" y="36" text-anchor="end" fill="#262725" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
    <text x="1160" y="53" text-anchor="end" direction="rtl" fill="#262725" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">العربية</text>
  </g>

  <g transform="translate(64 54)">
    <text x="0" y="20" fill="#262725" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="111" fill="#262725" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">PANEL <tspan fill="#D7684D">020</tspan></text>
    <text x="2" y="151" fill="#262725" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".75">IMPASTO · MINIATURE · TACTILE MEMORY</text>
    <text x="2" y="193" fill="#262725" font-family="sans-serif" font-size="18" font-weight="700">厚涂颜料岛 · 立体微缩场景 · 真实刀痕</text>
    <text x="2" y="222" fill="#262725" fill-opacity=".72" font-family="sans-serif" font-size="14" font-weight="600">厚塗りミニチュア · 임파스토 미니어처</text>
    <text x="2" y="251" fill="#262725" fill-opacity=".72" font-family="Arial, sans-serif" font-size="14" font-weight="600">طلاء كثيف · مشهد مصغّر مجسّم</text>
  </g>

  <g transform="translate(64 327)">
    <rect width="150" height="37" rx="7" fill="#262725"/>
    <text x="75" y="24" text-anchor="middle" fill="#F3F0E8" font-family="Courier New, monospace" font-size="12" font-weight="900">SOURCE-BOUND</text>
    <rect x="162" width="106" height="37" rx="7" fill="#D7684D"/>
    <text x="215" y="24" text-anchor="middle" fill="#F3F0E8" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
    <rect x="280" width="137" height="37" rx="7" fill="#D7D1C2"/>
    <text x="348.5" y="24" text-anchor="middle" fill="#262725" font-family="Courier New, monospace" font-size="12" font-weight="900">REAL IMPASTO</text>
    <rect x="429" width="147" height="37" rx="7" fill="#F3F0E8" stroke="#262725" stroke-width="1.5"/>
    <text x="502.5" y="24" text-anchor="middle" fill="#262725" font-family="Courier New, monospace" font-size="12" font-weight="900">RASTER ONLY</text>
